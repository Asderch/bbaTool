<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Data</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body{height:100vh;background:#111111;display:flex;align-items:center;justify-content:center;font-family:'Inter','Segoe UI',sans-serif}
    .splash{text-align:center}
    .splash img{height:50px;width:auto;margin-bottom:18px;display:block;margin-left:auto;margin-right:auto;opacity:.85}
    .splash h1{font-size:16px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:-.2px;margin-bottom:4px}
    .splash p{font-size:10px;color:rgba(255,255,255,.25);margin-bottom:24px;letter-spacing:.5px}
    .bar{width:160px;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:0 auto}
    .fill{height:100%;width:0%;background:rgba(62,207,142,.6);border-radius:2px;animation:load 4s ease-in-out forwards}
    @keyframes load{0%{width:0%}60%{width:70%}100%{width:100%}}
    .ver{margin-top:20px;font-size:9px;color:rgba(255,255,255,.12);letter-spacing:1px;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="splash">
    <img src="/assets/logo/bba-logo-mini.png" alt="BBA">
    <h1>Warehouse Data</h1>
    <p>The system is starting up...</p>
    <div class="bar"><div class="fill"></div></div>
    <div class="ver">V{{ APP_VERSION }}</div>
  </div>
</body>
</html>
